<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>EVA ChatKit</title>

    <!-- 3. ChatKit JS script from OpenAI -->
    <script
      src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"
      async
    ></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #050816;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .eva-wrapper {
        width: 100%;
        max-width: 420px;
        padding: 16px;
        box-sizing: border-box;
      }

      .eva-card {
        border-radius: 16px;
        background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        padding: 12px;
      }

      .eva-header {
        padding: 8px 12px 4px;
        font-size: 14px;
        color: #e5e7eb;
      }

      .eva-header strong {
        color: #22c55e;
      }

      .eva-chat {
        width: 100%;
        height: 560px;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="eva-wrapper">
      <div class="eva-card">
        <div class="eva-header">
          <strong>EVA Script</strong> · Asistente SFMC
        </div>
        <!-- Aquí meteremos el componente de ChatKit -->
        <div id="eva-chat-container"></div>
      </div>
    </div>

    <script>
      async function initEvaChat() {
        // 1. Pedimos el client_secret a tu función de Netlify
        const response = await fetch("/.netlify/functions/chatkit-session", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          // Aquí más adelante puedes mandar ContactKey, email, etc.
          body: JSON.stringify({ userId: "eva-test-user" }),
        });

        if (!response.ok) {
          console.error("Error getting client_secret", await response.text());
          return;
        }

        const data = await response.json();
        const clientToken = data.client_secret;

        // 2. Creamos el web component <openai-chatkit>
        const chatkit = document.createElement("openai-chatkit");

        // API config: le damos el clientToken
        chatkit.setOptions({
          api: { clientToken },
          // Opcional: un poquito de tema
          theme: {
            colorScheme: "dark",
            accentColor: "#22c55e",
            assistant: {
              name: "EVA Script",
            },
          },
        });

        chatkit.classList.add("eva-chat");

        // 3. Lo agregamos al contenedor
        document
          .getElementById("eva-chat-container")
          .appendChild(chatkit);
      }

      // Espera a que cargue el script de ChatKit
      window.addEventListener("load", () => {
        initEvaChat().catch((err) => console.error(err));
      });
    </script>
  </body>
</html>
