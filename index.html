<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>EVA Script · Asistente SFMC</title>

    <!-- Carga del script de ChatKit -->
    <script
      src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"
      defer
    ></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top, #0b1120, #000);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .eva-wrapper {
        width: 100%;
        max-width: 420px;
        padding: 16px;
        box-sizing: border-box;
      }

      .eva-card {
        border-radius: 16px;
        background: linear-gradient(180deg, #111827 0%, #020617 100%);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        padding: 12px;
      }

      .eva-header {
        padding: 8px 12px 4px;
        font-size: 14px;
        color: #e5e7eb;
      }

      .eva-header strong {
        color: #22c55e;
      }

      .eva-chat {
        width: 100%;
        height: 560px;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="eva-wrapper">
      <div class="eva-card">
        <div class="eva-header">
          <strong>EVA Script</strong> · Asistente SFMC
        </div>
        <div id="eva-chat-container"></div>
      </div>
    </div>

    <script>
      async function initEvaChat() {
        try {
          // 1️⃣ Obtener el client_secret de tu función Netlify
          const response = await fetch("/.netlify/functions/chatkit-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: "eva-test-user" }),
          });

          if (!response.ok) {
            console.error("Error al obtener client_secret:", response.status);
            console.error(await response.text());
            return;
          }

          const data = await response.json();
          const clientToken = data.client_secret;

          console.log("🔑 Client token recibido:", clientToken);

          if (!clientToken) {
            console.error("⚠️ No se recibió client_secret:", data);
            return;
          }

          // 2️⃣ Crear el componente de ChatKit
          const chatkit = document.createElement("openai-chatkit");

          // Configuración mínima recomendada
          chatkit.setOptions({
            api: { clientToken },
          });

          chatkit.classList.add("eva-chat");

          // 3️⃣ Agregar el componente al contenedor
          document
            .getElementById("eva-chat-container")
            .appendChild(chatkit);
        } catch (err) {
          console.error("Error inicializando EVA:", err);
        }
      }

      // Esperar a que todo cargue
      window.addEventListener("load", initEvaChat);
    </script>
  </body>
</html>
