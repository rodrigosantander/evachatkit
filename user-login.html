<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>EVA Script · Login Individual</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: url(img/imgbackground.jpg) no-repeat center center fixed;
      -webkit-background-size: cover;
      -moz-background-size: cover;
      -o-background-size: cover;
      background-size: cover;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-container {
      background: rgba(17, 24, 39, 0.9);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0px 0px 51px 12px rgba(46, 168, 255, 0.73);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-header {
      margin-bottom: 30px;
    }

    .login-header h1 {
      color: #22c55e;
      margin: 0 0 10px 0;
      font-size: 28px;
    }

    .login-header p {
      color: #e5e7eb;
      margin: 0;
      font-size: 16px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #e5e7eb;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #374151;
      border-radius: 8px;
      background: #1f2937;
      color: #ffffff;
      font-size: 16px;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #22c55e;
    }

    .login-button {
      background: #22c55e;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-button:hover {
      background: #16a34a;
    }

    .login-button:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }

    .error-message {
      color: #ef4444;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    .loading {
      display: none;
      color: #22c55e;
      font-size: 14px;
      margin-top: 10px;
    }

    .switch-mode {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #374151;
    }

    .switch-mode a {
      color: #22c55e;
      text-decoration: none;
      font-size: 14px;
    }

    .switch-mode a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>EVA Script</h1>
      <p>Asistente SFMC - Acceso Individual</p>
    </div>
    
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="login-button" id="loginButton">
        Iniciar Sesión
      </button>
      
      <div class="error-message" id="errorMessage">
        Credenciales incorrectas. Verifica tu usuario y contraseña.
      </div>
      
      <div class="loading" id="loadingMessage">
        Verificando credenciales...
      </div>
    </form>
    
    <div class="switch-mode">
      <a href="/login.html">¿Tienes contraseña compartida? Haz clic aquí</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const button = document.getElementById('loginButton');
      const errorMsg = document.getElementById('errorMessage');
      const loadingMsg = document.getElementById('loadingMessage');
      
      // Show loading state
      button.disabled = true;
      errorMsg.style.display = 'none';
      loadingMsg.style.display = 'block';
      
      try {
        const response = await fetch('/.netlify/functions/auth-user-login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ 
            username: username,
            password: password 
          })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          // Store auth token and user info in localStorage
          localStorage.setItem('eva_auth_token', data.token);
          localStorage.setItem('eva_auth_expires', data.expires);
          localStorage.setItem('eva_user_info', JSON.stringify(data.user));
          
          // Redirect to main app
          window.location.href = '/';
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (error) {
        errorMsg.textContent = error.message || 'Error de conexión. Inténtalo de nuevo.';
        errorMsg.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('username').focus();
      } finally {
        button.disabled = false;
        loadingMsg.style.display = 'none';
      }
    });

    // Focus on username field when page loads
    window.addEventListener('load', function() {
      document.getElementById('username').focus();
    });
  </script>
</body>
</html>
